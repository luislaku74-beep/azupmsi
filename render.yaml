services:
  - type: web
    name: azupimsi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: azupimsi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: azupimsi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: azupimsi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: azupimsi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: azupimsi-db
          property: password
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require

databases:
  - name: azupimsi-db
    databaseName: azu_pimsi
    user: azupimsi
    plan: free
    postgresMajorVersion: "17"
