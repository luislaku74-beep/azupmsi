services:
  - type: pserv
    name: azupimsi-db
    runtime: docker
    dockerfilePath: ./Dockerfile.mysql
    disk:
      name: azupimsi-db-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: azu_pimsi
      - key: MYSQL_USER
        value: azu_pimsi_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: azupimsi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: azupimsi-db
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: azupimsi-db
          property: port
      - key: DB_NAME
        value: azu_pimsi
      - key: DB_USER
        value: azu_pimsi_app
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: azupimsi-db
          envVarKey: MYSQL_PASSWORD
